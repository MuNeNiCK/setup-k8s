name: Scenario Tests

# The full VM matrices run before a release (pull requests into main) and on
# demand (Actions > Run workflow).
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per pull request (per branch for manual runs); a newer push replaces it
  group: scenario-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scenario-tests:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: deploy-remove
            command: ./scenarios/deploy-remove.sh --distro ubuntu-24.04-cloud-amd64
          - name: join
            command: ./scenarios/join.sh --distro ubuntu-24.04-cloud-amd64
          - name: preflight
            command: ./scenarios/preflight.sh --distro ubuntu-24.04-cloud-amd64
          - name: backup-restore
            command: ./scenarios/backup-restore.sh --distro ubuntu-24.04-cloud-amd64
          - name: cert-renew
            command: ./scenarios/cert-renew.sh --distro ubuntu-24.04-cloud-amd64
          - name: swap-reboot
            command: ./scenarios/swap-reboot.sh --distro ubuntu-24.04-cloud-amd64
          - name: options
            command: ./scenarios/options.sh --distro ubuntu-24.04-cloud-amd64
          - name: upgrade-crio-rocky9
            command: ./scenarios/upgrade.sh --distro rocky-9-cloud-amd64 --deploy-args "--cri crio"
          - name: proxy-ubuntu
            command: ./scenarios/proxy.sh --distro ubuntu-24.04-cloud-amd64
          - name: proxy-rocky9-crio
            command: ./scenarios/proxy.sh --distro rocky-9-cloud-amd64 --setup-args "--cri crio"
          - name: legacy-upgrade-ubuntu
            command: ./scenarios/legacy-upgrade.sh --distro ubuntu-24.04-cloud-amd64
          - name: legacy-upgrade-rocky9
            command: ./scenarios/legacy-upgrade.sh --distro rocky-9-cloud-amd64
          - name: legacy-upgrade-arch
            command: ./scenarios/legacy-upgrade.sh --distro archlinux-cloud-amd64 --no-upgrade
          - name: legacy-upgrade-alpine
            command: ./scenarios/legacy-upgrade.sh --distro alpine-3.23-cloud-amd64 --no-upgrade
          - name: upgrade
            command: ./scenarios/upgrade.sh --distro ubuntu-24.04-cloud-amd64
          - name: upgrade-skip-drain
            command: ./scenarios/upgrade.sh --distro ubuntu-24.04-cloud-amd64 --upgrade-args "--skip-drain --no-rollback"
          - name: generic
            command: ./scenarios/generic.sh --host-distro ubuntu-24.04-cloud-amd64 --memory 4096 --cpus 2
          - name: ha-init
            command: ./scenarios/ha.sh --distro ubuntu-24.04-cloud-amd64 --memory 4096 --cpus 2
          - name: ha-failover
            command: ./scenarios/ha.sh --failover --distro ubuntu-24.04-cloud-amd64 --memory 3072 --cpus 2
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run scenario test
        working-directory: test
        env:
          BASH_DEBUG: '0'
        run: |
          set -euo pipefail
          ${{ matrix.command }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.name }}
          path: |
            test/results/logs
            test/results/test-result.json
          if-no-files-found: ignore

      - name: Cleanup workspace artifacts
        if: always()
        run: |
          sudo rm -rf test/data
          sudo rm -rf test/results
