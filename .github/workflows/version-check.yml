name: Component Version Check

# Weekly comparison of the component defaults in lib/core/defaults.sh with
# upstream releases. Keeps one open issue (label: dependencies) up to date
# while an update is available and closes it when all defaults are current.

on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop

      - name: Compare defaults with upstream releases
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          sh scripts/check-versions.sh report.md || rc=$?
          if [ "$rc" -gt 1 ]; then exit "$rc"; fi
          echo "outdated=$([ "$rc" -eq 1 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          OUTDATED: ${{ steps.check.outputs.outdated }}
        run: |
          title="Component defaults have updates available"
          gh label create dependencies --color 0366d6 --description "Dependency updates" 2>/dev/null || true
          number=$(gh issue list --label dependencies --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ "$OUTDATED" = true ]; then
            if [ -n "$number" ]; then
              gh issue edit "$number" --body-file report.md
            else
              gh issue create --title "$title" --label dependencies --body-file report.md
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "All component defaults are current."
          fi
