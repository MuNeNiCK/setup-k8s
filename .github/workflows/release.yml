name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build bundle
        run: sh scripts/build.sh dist/setup-k8s.sh "${GITHUB_REF_NAME}"

      - name: Check bundle
        run: |
          set -eu
          test "$(sh dist/setup-k8s.sh --version)" = "setup-k8s ${GITHUB_REF_NAME}"
          sh dist/setup-k8s.sh --help >/dev/null
          (cd dist && sha256sum -c setup-k8s.sh.sha256)

      - name: Release notes from CHANGELOG.md
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          # The section "## [<version>] - <date>" up to the next "## [" heading
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { next }
            on { print }' CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/setup-k8s.sh dist/setup-k8s.sh.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --notes-file dist/notes.md \
            --verify-tag
