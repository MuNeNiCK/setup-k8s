name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Build bundle
        run: sh scripts/build.sh dist/setup-k8s.sh "${GITHUB_REF_NAME}"

      - name: Check bundle
        run: |
          set -eu
          test "$(sh dist/setup-k8s.sh --version)" = "setup-k8s ${GITHUB_REF_NAME}"
          sh dist/setup-k8s.sh --help >/dev/null
          (cd dist && sha256sum -c setup-k8s.sh.sha256)

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/setup-k8s.sh dist/setup-k8s.sh.sha256 \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
