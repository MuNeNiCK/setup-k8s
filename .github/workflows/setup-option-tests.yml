name: Setup Option Tests

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # PR smoke test: single Ubuntu 24.04 offline test for fast merge-time feedback
  pr-smoke-test:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run PR smoke test (Ubuntu 24.04 offline)
        working-directory: test
        run: |
          set -euo pipefail
          ./scenarios/init-cleanup.sh --offline ubuntu-24.04-cloud-amd64

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-pr-smoke-test
          path: |
            test/results/logs
            test/results/test-result.json
          if-no-files-found: ignore

      - name: Cleanup workspace artifacts
        if: always()
        run: |
          sudo rm -rf test/data
          sudo rm -rf test/results

  # Setup option matrix: runs on push and manual dispatch only
  setup-option-tests:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu2404-online-latest
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: ""
            setup_args: ""
            test_mode: "online"
          - name: ubuntu2404-default
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: ""
            setup_args: ""
          - name: ubuntu2404-ipvs-crio
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: ""
            setup_args: "--proxy-mode ipvs --cri crio"
          - name: ubuntu2404-nftables-k130
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: "1.30"
            setup_args: "--proxy-mode nftables"
          - name: ubuntu2404-helm-completion
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: ""
            setup_args: "--install-helm true --completion-shells bash"
          - name: ubuntu2404-kustomize-no-completion
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: ""
            setup_args: "--verbose --log-dir /tmp/setup-k8s-logs --audit-syslog --install-kustomize true --enable-completion false"
          - name: ubuntu2404-completion-shells
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: ""
            setup_args: "--completion-shells bash,zsh,fish"
          - name: ubuntu2404-network-config
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: ""
            setup_args: "--pod-network-cidr 10.244.0.0/16 --service-cidr 10.96.0.0/12 --apiserver-advertise-address __VM_IP__ --control-plane-endpoint __VM_IP__:6443 --api-server-extra-sans setup-k8s.local,__VM_IP__ --kubelet-node-ip __VM_IP__"
          - name: ubuntu2404-dualstack-cidrs
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: ""
            setup_args: "--pod-network-cidr 10.244.0.0/16,fd00:10:244::/48 --service-cidr 10.96.0.0/12,fd00:20::/108"
          - name: ubuntu2404-ipv6-single-stack
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: ""
            guest_ip6: "fd00:10:2::15/64"
            setup_args: "--pod-network-cidr fd00:10:244::/48 --service-cidr fd00:20::/108 --apiserver-advertise-address __VM_IP6__ --control-plane-endpoint [__VM_IP6__]:6443 --api-server-extra-sans setup-k8s.local,__VM_IP6__ --kubelet-node-ip __VM_IP6__"
          - name: ubuntu2404-kubeadm-patch
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: ""
            setup_args: "--kubeadm-config-patch __KUBEADM_PATCH__"
          - name: ubuntu2404-swap-enabled
            distro: ubuntu-24.04-cloud-amd64
            k8s_version: "1.32"
            setup_args: "--swap-enabled"
          - name: ubuntu2204-custom-k8s
            distro: ubuntu-22.04-cloud-amd64
            k8s_version: "1.31"
            setup_args: "--install-helm false"
          - name: ubuntu2204-cri-containerd-ipvs
            distro: ubuntu-22.04-cloud-amd64
            k8s_version: ""
            setup_args: "--proxy-mode ipvs --cri containerd"
          - name: ubuntu2204-legacy-k128
            distro: ubuntu-22.04-cloud-amd64
            k8s_version: "1.28"
            setup_args: ""
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run setup-k8s option test
        working-directory: test
        env:
          SETUP_ARGS: ${{ matrix.setup_args }}
          K8S_VERSION: ${{ matrix.k8s_version }}
          DISTRO: ${{ matrix.distro }}
          TEST_MODE: ${{ matrix.test_mode || 'offline' }}
          VM_GUEST_IP6: ${{ matrix.guest_ip6 || '' }}
        run: |
          set -euo pipefail
          # Use test_mode from matrix (defaults to offline)
          mode_flag="--${TEST_MODE}"

          k8s_flag=""
          if [ -n "$K8S_VERSION" ]; then
            k8s_flag="--k8s-version $K8S_VERSION"
          fi

          setup_flag=()
          if [ -n "$SETUP_ARGS" ]; then
            setup_flag=(--setup-args "$SETUP_ARGS")
          fi

          ./scenarios/init-cleanup.sh $mode_flag $k8s_flag "${setup_flag[@]}" "$DISTRO"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.name }}
          path: |
            test/results/logs
            test/results/test-result.json
          if-no-files-found: ignore

      - name: Cleanup workspace artifacts
        if: always()
        run: |
          sudo rm -rf test/data
          sudo rm -rf test/results
