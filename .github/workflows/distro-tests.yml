name: Setup Distro Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: distro-tests
  cancel-in-progress: false

jobs:
  distro-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu-24.04-cloud-amd64
          - ubuntu-22.04-cloud-amd64
          - debian-13-cloud-amd64
          - debian-12-cloud-amd64
          - debian-11-cloud-amd64
          - centos-stream-10-cloud-amd64
          - centos-stream-9-cloud-amd64
          - fedora-44-cloud-amd64
          - fedora-43-cloud-amd64
          - opensuse-tumbleweed-cloud-amd64
          - opensuse-leap-16.0-cloud-amd64
          - rocky-10-cloud-amd64
          - rocky-9-cloud-amd64
          - alma-10-cloud-amd64
          - alma-9-cloud-amd64
          - oracle-9-cloud-amd64
          - archlinux-cloud-amd64
          - alpine-3.23-cloud-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Run setup-k8s test (online)
        working-directory: test
        env:
          BASH_DEBUG: '0'
        run: |
          set -euo pipefail
          ./scenarios/init-cleanup.sh --online ${{ matrix.distro }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: logs-${{ matrix.distro }}
          path: |
            test/results/logs
            test/results/test-result.json
          if-no-files-found: ignore

      - name: Cleanup workspace artifacts
        if: always()
        run: |
          sudo rm -rf test/data
          sudo rm -rf test/results
