name: Setup Distro Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Weekly run against the current distribution images (the code on main)
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; a newer push to develop replaces the running one,
  # runs for main are never cancelled.
  group: distro-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The distribution list lives in test/matrices/distro-cloud-images.txt,
  # shared with ./scenarios/init-cleanup.sh --all.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      distros: ${{ steps.read.outputs.distros }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read distro matrix
        id: read
        run: |
          # Same rules as test_list_matrix_distros: strip comments and blank lines
          distros=$(sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' test/matrices/distro-cloud-images.txt \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "distros=${distros}" >> "$GITHUB_OUTPUT"

  distro-tests:
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.matrix.outputs.distros) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run setup-k8s test
        working-directory: test
        env:
          BASH_DEBUG: '0'
        run: |
          set -euo pipefail
          ./scenarios/init-cleanup.sh ${{ matrix.distro }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.distro }}
          path: |
            test/results/logs
            test/results/test-result.json
          if-no-files-found: ignore

      - name: Cleanup workspace artifacts
        if: always()
        run: |
          sudo rm -rf test/data
          sudo rm -rf test/results
