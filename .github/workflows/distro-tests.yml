name: Setup Distro Tests

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  # Weekly run against the current distribution images (the code on main)
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One run per branch; a newer push to develop replaces the running one,
  # runs for main are never cancelled.
  group: distro-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  distro-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        distro:
          - ubuntu-24.04-cloud-amd64
          - ubuntu-22.04-cloud-amd64
          - debian-13-cloud-amd64
          - debian-12-cloud-amd64
          - debian-11-cloud-amd64
          - centos-stream-10-cloud-amd64
          - centos-stream-9-cloud-amd64
          - fedora-44-cloud-amd64
          - fedora-43-cloud-amd64
          - opensuse-tumbleweed-cloud-amd64
          - opensuse-leap-16.0-cloud-amd64
          - rocky-10-cloud-amd64
          - rocky-9-cloud-amd64
          - alma-10-cloud-amd64
          - alma-9-cloud-amd64
          - oracle-9-cloud-amd64
          - archlinux-cloud-amd64
          - alpine-3.23-cloud-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run setup-k8s test
        working-directory: test
        env:
          BASH_DEBUG: '0'
        run: |
          set -euo pipefail
          ./scenarios/init-cleanup.sh ${{ matrix.distro }}

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: logs-${{ matrix.distro }}
          path: |
            test/results/logs
            test/results/test-result.json
          if-no-files-found: ignore

      - name: Cleanup workspace artifacts
        if: always()
        run: |
          sudo rm -rf test/data
          sudo rm -rf test/results
